[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rum"
version = "0.1.0"
description = "rum - a Discord API wrapper for Python, forked from Pycord"
authors = [
    { name = "The rum team" }
]
readme = "README.md"
requires-python = ">=3.11, <3.15"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "discord",
    "discord-bot",
    "python",
    "async",
    "pycord",
    "rum",
    "bot",
    "api-wrapper",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "h11>=0.16.0,<1",
    "wsproto>=1.2.0,<2",
    "msgspec~=0.22.0",
    "backports.zstd; python_version < \"3.14\"",
    "typing_extensions>=4.14.0,<5",
    "yarl>=1.6.3,<2.0",
]

[project.optional-dependencies]
voice = [
    "PyNaCl>=1.6.2,<1.7",
    "davey>=0.1.4,<1",
]
music = []

[project.urls]
Source = "https://github.com/breedservices/Rum"
Issues = "https://github.com/breedservices/Rum/issues"
Upstream = "https://github.com/Pycord-Development/pycord"

[tool.hatch.build.targets.wheel]
packages = ["rum", "discord"]

[tool.hatch.build.targets.sdist]
include = [
    "/rum",
    "/discord",
    "/scripts",
    "/examples",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
    "/.gitignore",
    "/.pre-commit-config.yaml",
]
exclude = [
    "/docs/api",
    "/**/__pycache__",
    "/**/*.pyc",
]

[dependency-groups]
dev = [
    "pylint~=4.1.3",
    "mypy~=2.4.1",
    "coverage~=7.10",
    "pre-commit==4.6.2",
    "codespell==2.4.3",
    "bandit==1.9.4",
    "flake8==7.3.0",
    "uv>=0.5.0",
]
test = [
    "pytest~=9.2.0",
    "pytest-asyncio~=1.4.0",
]

[tool.black]
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']

[tool.isort]
profile = "black"

[tool.mypy]
namespace_packages = true
install_types = true
strict = true
show_error_codes = true
#allow_untyped_decorators = true
#allow_untyped_calls = true
ignore_errors = true

[tool.pylint.main]
extension-pkg-whitelist = [
    "pydantic",
    "ujson"
]
py-version = 3.11

[tool.pylint.messages_control]
enable = [
    "bad-indentation",
    "line-too-long"
]
disable = [
    "protected-access",
    "fixme"
]

[tool.pylint.format]
indent-string = '    '
max-line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
