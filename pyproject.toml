[build-system]
requires = [
    "setuptools>=77.0.3,<=80.9.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "rum"
version = "0.1.0"
authors = [
    { name = "The rum team" }
]
readme = { content-type = "text/markdown", file = "README.md" }
requires-python = ">=3.11, <3.15"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
# `description` and `keywords` are derived from README.md by setup.py so the
# README stays the single source of truth for the project metadata.
dynamic = [
    "description",
    "keywords",
    "dependencies",
    "optional-dependencies",
]

[project.urls]
Source = "https://github.com/breedservices/Rum"
Issues = "https://github.com/breedservices/Rum/issues"
Upstream = "https://github.com/Pycord-Development/pycord"

[tool.setuptools]
packages = [
    "rum",
    "rum.types",
    "rum.sinks",
    "rum.ui",
    "rum.webhook",
    "rum.commands",
    "rum.ext.commands",
    "rum.ext.tasks",
    "rum.ext.pages",
    "rum.ext.bridge",
    "rum.bin",
    "rum.voice",
    "discord",
]

[tool.setuptools.dynamic]
dependencies = { file = "requirements/_.txt" }
readme = { content-type = "text/markdown", file = "README.md" }

[tool.setuptools.dynamic.optional-dependencies]
docs = { file = "requirements/docs.txt" }
speed = { file = "requirements/speed.txt" }
voice = { file = "requirements/voice.txt" }

[dependency-groups]
dev = [
    "pylint~=4.1.3",
    "mypy~=2.4.1",
    "coverage~=7.10",
    "pre-commit==4.6.2",
    "codespell==2.4.3",
    "bandit==1.9.4",
    "flake8==7.3.0",
    "tox>=4.27.0",
    "tox-gh>=1.5.0",
    "uv>=0.5.0",
]
test = [
    "pytest~=9.2.0",
    "pytest-asyncio~=1.4.0",
]

[tool.black]
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']

[tool.isort]
profile = "black"

[tool.mypy]
namespace_packages = true
install_types = true
strict = true
show_error_codes = true
#allow_untyped_decorators = true
#allow_untyped_calls = true
ignore_errors = true

[tool.pylint.main]
extension-pkg-whitelist = [
    "pydantic",
    "ujson"
]
py-version = 3.11

[tool.pylint.messages_control]
enable = [
    "bad-indentation",
    "line-too-long"
]
disable = [
    "protected-access",
    "fixme"
]

[tool.pylint.format]
indent-string = '    '
max-line-length = 120

[tool.pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.tox]
requires = ["tox>=4"]
env_list = ["3.14", "3.13", "3.12", "3.11", "3.14-novoice"]

[tool.tox.env_run_base]
description = "run unit tests"
commands = [["pytest", { replace = "posargs", default = ["tests"], extend = true }]]
dependency_groups = ["test"]
extras = ["voice"]

[tool.tox.env."3.14-novoice"]
description = "run import and warning tests without the voice extra"
commands = [[
    "pytest",
    { replace = "posargs", default = ["tests/voice/test_dependency_behavior.py"], extend = true }
]]
dependency_groups = ["test"]
extras = []

# GitHub actions
[tool.tox.gh.python]
"3.14" = ["3.14", "3.14-novoice"]
"3.13" = ["3.13"]
"3.12" = ["3.12"]
"3.11" = ["3.11"]
