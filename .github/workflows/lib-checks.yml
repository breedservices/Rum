name: "Library Checks"

on:
  push:
    paths:
      - "rum/**"
      - "examples/**"
      - "requirements/**"
      - "tests/**"
      - ".github/actions/**"
      - ".github/workflows/lib-checks.yml"
      - "LICENSE"
      - "MANIFEST.in"
      - "README.md"
      - "*.toml"
      - "*.py"
      - ".*"
    branches: [ master ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      lib: ${{ steps.filter.outputs.lib }}
    steps:
      - name: "Check changed paths"
        id: filter
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('lib', 'true');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const matches = (file) => (
              file.startsWith('rum/') ||
              file.startsWith('examples/') ||
              file.startsWith('requirements/') ||
              file.startsWith('tests/') ||
              file.startsWith('.github/actions/') ||
              file === '.github/workflows/lib-checks.yml' ||
              file === 'LICENSE' ||
              file === 'MANIFEST.in' ||
              file === 'README.md' ||
              (!file.includes('/') && file.endsWith('.toml')) ||
              (!file.includes('/') && file.endsWith('.py')) ||
              /^\.[^/]+$/.test(file)
            );

            const changed = files.some((file) => matches(file.filename));
            core.setOutput('lib', changed ? 'true' : 'false');

            if (!changed) {
              core.notice('Library checks skipped because no changed files matched the library check paths.');
              await core.summary
                .addHeading('Library checks skipped', 2)
                .addRaw('No changed files matched the library check paths.')
                .write();
            }

  codespell:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Setup Python dev environment"
        uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.14"
      - name: "Run codespell"
        run:
          codespell --ignore-words-list="groupt,nd,ot,ro,falsy,BU,womens,pre-select,pre-emptively" \
          --skip="*.po,*.pot,uv.lock,docs/build,.venv,rum-cache"
  bandit:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Setup Python dev environment"
        uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.14"
      - name: "Run bandit"
        run: bandit --recursive  --skip B101,B104,B105,B110,B307,B311,B404,B603,B607 --exclude ./.venv,./build,./dist,./docs/_build .
  readme-metadata:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Setup Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: "Check README metadata is in sync"
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip uv
          uv build --wheel --out-dir dist
          python3 - <<'PY'
          import glob, sys, zipfile
          sys.path.insert(0, "scripts")
          from readme_metadata import read_metadata

          metadata = read_metadata()
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as zf:
              name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              raw = zf.read(name).decode("utf-8")

          fields = {}
          for line in raw.splitlines():
              if not line.strip():
                  break
              key, _, value = line.partition(": ")
              fields[key] = value

          expected_summary = metadata["description"]
          expected_keywords = ",".join(metadata["keywords"])
          errors = []
          if fields.get("Summary") != expected_summary:
              errors.append(f"Summary: {fields.get('Summary')!r} != {expected_summary!r}")
          if fields.get("Keywords") != expected_keywords:
              errors.append(f"Keywords: {fields.get('Keywords')!r} != {expected_keywords!r}")
          if errors:
              print("README metadata is out of sync with the built package:")
              for error in errors:
                  print("  -", error)
              sys.exit(1)
          print("README metadata matches the built package metadata.")
          PY
  pylint:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Setup Python dev environment"
        uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.14"
      - name: "Setup cache"
        id: cache-pylint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pylint.d
          key: pylint-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml', 'rum/**/*.py') }}
          restore-keys: |
            pylint-${{ runner.os }}-py3.14-
      - name: "Run pylint"
        run: pylint rum/ --exit-zero
  mypy:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Setup Python dev environment"
        uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.14"
      - name: "Setup cache"
        id: cache-mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml', 'rum/**/*.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.14-
      - name: "Make mypy cache directory"
        id: cache-dir-mypy
        run: mkdir -p -v .mypy_cache
      - name: "Run mypy"
        run: mypy --non-interactive rum/
  flake8:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Setup Python dev environment"
        uses: ./.github/actions/setup-python-dev
        with:
          python-version: "3.14"
      - name: "Lint with flake8"
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
  tests:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.11", "3.14" ]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Setup Python dev environment"
        uses: ./.github/actions/setup-python-dev
        with:
          python-version: ${{ matrix.python-version }}
          install-voice: "true"
          groups: "test"

      - name: "Run tests"
        run: |
          uv run --group test --extra voice pytest tests -q
          uv run --isolated --no-extra voice --group test pytest tests/voice/test_dependency_behavior.py -q
  tests-full:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.lib == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Setup Python dev environment"
        uses: ./.github/actions/setup-python-dev
        with:
          python-version: ${{ matrix.python-version }}
          install-voice: "true"
          groups: "test"

      - name: "Run tests"
        run: |
          uv run --group test --extra voice pytest tests -q
          uv run --isolated --no-extra voice --group test pytest tests/voice/test_dependency_behavior.py -q
  tests-pass: # ref: https://github.com/orgs/community/discussions/4324#discussioncomment-3477871
    runs-on: ubuntu-latest
    needs: [ changes, tests, tests-full ]
    if: always()
    steps:
      - name: Tests succeeded
        if: ${{ !(contains(needs.*.result, 'failure')) && !(contains(needs.*.result, 'cancelled')) }}
        run: exit 0
      - name: Tests failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
