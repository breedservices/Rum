name: "Setup Python dev environment"
description: "Set up Python and install development dependencies."

inputs:
  python-version:
    description: "Python version to install."
    required: true
  install-voice:
    description: "Install the voice extra."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: "Setup Python"
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: "Install uv"
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv

    - name: "Cache uv"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .uv_cache
        key: uv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-${{ inputs.python-version }}-

    - name: "Install dependencies"
      if: ${{ inputs.install-voice != 'true' }}
      shell: bash
      run: |
        uv sync --group dev
        echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

    - name: "Install dependencies with voice extra"
      if: ${{ inputs.install-voice == 'true' }}
      shell: bash
      run: |
        uv sync --group dev --extra voice
        echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
